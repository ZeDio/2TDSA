<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conteúdo — Disruptive Architectures</title>
<style>
:root{--purple:#7e57c2;--bg:#1f2028;--surface:#25262e;--surface2:#2b2c34;--line:#3b3c45;--text:#e6e6ea;--muted:#aaaab5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}.top{background:var(--purple);padding:0 15px}.bar{height:48px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:700}.back{color:#fff}.page{width:min(980px,calc(100% - 32px));margin:0 auto;padding:38px 0 70px}.crumb{color:#b995df;font-size:13px;margin-bottom:20px}.meta{color:var(--muted);font-size:12px;margin-bottom:26px}.content{background:#22232b;border:1px solid var(--line);border-radius:5px;padding:36px 42px;overflow:hidden}.content h1{font-size:31px;font-weight:400;margin-top:0;padding-bottom:18px;border-bottom:1px solid var(--line)}.content h2{font-size:24px;font-weight:400;margin-top:34px}.content h3{font-size:19px;font-weight:500;margin-top:28px}.content p,.content li{color:#d0d0d6;line-height:1.72}.content a{color:#b995df}.content img{max-width:100%;height:auto;display:block;margin:18px auto;border-radius:4px}.content table{width:100%;border-collapse:collapse;display:block;overflow:auto;margin:20px 0}.content th,.content td{border:1px solid #484953;padding:9px 11px;text-align:left;vertical-align:top}.content th{background:#2b2c34}.content pre{background:#181920;border:1px solid #363741;border-radius:5px;padding:15px;overflow:auto}.content code{font-family:Consolas,monospace;font-size:.9em}.content :not(pre)>code{background:#30313a;padding:2px 5px;border-radius:3px;color:#e0d6ee}.content blockquote{border-left:3px solid var(--purple);margin:18px 0;padding:5px 18px;color:#bdbdc7;background:#292a32}.content hr{border:0;border-top:1px solid var(--line);margin:28px 0}.error{padding:24px;border:1px solid #70404a;color:#ffb4bc;background:#302126;border-radius:5px}@media(max-width:650px){.content{padding:23px 18px}.content h1{font-size:26px}.page{width:min(100% - 20px,980px)}}
</style>
</head><body><header class="top"><div class="bar"><strong class="brand">Disruptive Architectures</strong><a class="back" href="index.html">← Voltar</a></div></header><main class="page"><div class="crumb">Home / Conteúdo</div><div id="meta" class="meta">Carregando...</div><article id="content" class="content"></article></main>
<script>
// A API roda em 8000. Assim o site funciona tanto aberto pelo navegador
// quanto pelo Live Server (5500/5501 etc.) ou pelo próprio Uvicorn (8000).
const API_BASE = 'https://twotdsa.onrender.com';
const params=new URLSearchParams(location.search);const arquivo=params.get('arquivo');const content=document.getElementById('content');const meta=document.getElementById('meta');
if(!arquivo){content.innerHTML='<div class="error">Nenhum arquivo Markdown foi informado.</div>';meta.textContent='';}
else{fetch(`${API_BASE}/api/material?arquivo=${encodeURIComponent(arquivo)}`).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.detail||'Erro');document.title=d.titulo+' — Disruptive Architectures';meta.textContent=`${d.categoria} · ${d.arquivo}`;content.innerHTML=d.conteudo;}).catch(e=>{meta.textContent='';content.innerHTML=`<div class="error">Não foi possível carregar este conteúdo.<br><br>${e.message}</div>`;});}
</script></body></html>
