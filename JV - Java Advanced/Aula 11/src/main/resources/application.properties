spring.application.name=swagger

springdoc.info.title= API de Tarefas - To-Do List
springdoc.info.description= API simples para gerenciamento de tarefas diarias
springdoc.info.version= v1.0.0

springdoc.api-docs.path= /api-docs
springdoc.swagger-ui.path= /swagger-ui.html
springdoc.swagger-ui.operationsSorter= method
springdoc.swagger-ui.try-it-out-enabled= true

spring.datasource-url=jdbc:h2:mem:tarefas_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName= org.h2.Driver
spring.datasource.username= sa
spring.datasource.password=

spring.h2.console.enabled= true
spring.h2.console.path= /h2-console

spring.jpa.database-platform= org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto= create-drop
spring.jpa.show-sql= true
spring.jpa.properties.hibernate.format_sql= true

server.port= 8080
server.servlet.context-path= /api

loggin.level.org.springdo= DEBUG